name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      live_validation:
        description: Validar también catálogo, embeddings y Groq reales (requiere GROQ_API_KEY)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pruebas y seguridad obligatorias
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Instalar dependencias CPU y herramientas de calidad
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Pruebas unitarias y funcionales con cobertura
        env:
          OMP_NUM_THREADS: '2'
        run: >-
          python -m pytest tests/ -v --junitxml=reports/tests.xml
          --cov=agent --cov=services --cov=memory --cov=observability --cov=utils
          --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=80
      - name: Bloquear vulnerabilidades de dependencias
        run: python scripts/audit_dependencies.py
      - name: SonarQube y Quality Gate obligatorio
        run: python scripts/sonarqube_gate.py
      - name: Conservar resultados de calidad y seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn

  docker-deploy:
    name: Construcción y despliegue simulado
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: gmcomponents-ev2:${{ github.sha }}
      VCS_REF: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: gmcomponents-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar orquestación
        run: docker compose config --quiet
      - name: Construir imagen identificada por commit
        run: docker compose build gmcomponents
      - name: Desplegar dos réplicas detrás del gateway
        run: docker compose up -d --no-build --scale gmcomponents=2 --wait --wait-timeout 180
      - name: Comprobar gateway y cada réplica
        run: |
          curl --fail --silent http://127.0.0.1:8501/_stcore/health
          docker compose exec -T --index 1 gmcomponents python scripts/smoke_test.py
          docker compose exec -T --index 2 gmcomponents python scripts/smoke_test.py
      - name: Validar servicios externos reales cuando se solicite
        if: github.event_name == 'workflow_dispatch' && inputs.live_validation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          python -c 'import os; assert os.getenv("GROQ_API_KEY"), "Falta el secreto GROQ_API_KEY en GitHub Actions"'
          docker compose run --rm --no-deps -e GROQ_API_KEY -e SERP_API_KEY gmcomponents python scripts/smoke_test.py --live
      - name: Guardar evidencia de despliegue
        if: always()
        run: |
          mkdir -p reports
          docker compose ps --all --format json > reports/containers.json
          docker compose logs --no-color > reports/deployment.log
          docker image inspect "$APP_IMAGE" --format '{{.Id}} {{index .Config.Labels "org.opencontainers.image.revision"}}' > reports/image.txt
      - name: Publicar evidencia vinculada al commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: reports/
      - name: Limpiar entorno simulado
        if: always()
        run: docker compose down --volumes --remove-orphans
