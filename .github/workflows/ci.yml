name: CI-CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  agente-python:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con PyTest
        run: python -m pytest tests/ -v


  docker-deploy:
    name: Docker Build y Deploy
    runs-on: ubuntu-latest
    needs: agente-python

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Mostrar versiones
        run: |
          docker --version
          docker compose version

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gmcomponents-ev2:latest .

      - name: Levantar entorno simulado
        run: docker compose up -d --no-build

      - name: Mostrar contenedores
        run: docker compose ps

      - name: Esperar aplicación saludable
        shell: bash
        run: |
          echo "Esperando a GM Components..."

          for i in {1..12}; do
            if curl --fail --silent http://localhost:8501/_stcore/health > /dev/null; then
              echo "Aplicación saludable."
              exit 0
            fi

            echo "Intento $i/12 - esperando 10 segundos..."
            sleep 10
          done

          echo "La aplicación no respondió correctamente."
          docker compose ps
          docker compose logs
          exit 1

      - name: Verificar Healthcheck
        run: curl --fail http://localhost:8501/_stcore/health

      - name: Mostrar estado final
        run: docker compose ps

      - name: Detener entorno
        if: always()
        run: docker compose down