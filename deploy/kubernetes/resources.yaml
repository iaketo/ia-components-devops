apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: gmcomponents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: gmcomponents
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: gmcomponents
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: gmcomponents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: gmcomponents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: grafana/alloy:v1.11.3
        ports:
        - containerPort: 12345
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 12345
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /-/ready
            port: 12345
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /-/ready
            port: 12345
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/var/lib/alloy
        - /etc/alloy/config.alloy
        volumeMounts:
        - name: alloy-config
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
      serviceAccountName: alloy
      volumes:
      - name: alloy-config
        configMap:
          name: alloy-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
