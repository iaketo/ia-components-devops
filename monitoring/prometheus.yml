global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gmcomponents
    dns_sd_configs:
      - names: [gmcomponents]
        type: A
        port: 9100
        refresh_interval: 5s
  - job_name: ci
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
  - job_name: gateway-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://gateway:8080/_stcore/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
