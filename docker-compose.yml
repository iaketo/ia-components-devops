services:
  gmcomponents:
    build:
      context: .
      dockerfile: Dockerfile

    image: gmcomponents-ev2:latest
    container_name: gmcomponents-app

    ports:
      - "8501:8501"

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-dummy}
      SERP_API_KEY: ${SERP_API_KEY:-dummy}

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    cpus: 1.0
    mem_limit: 2g